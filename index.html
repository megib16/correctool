<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Correctool – transcription spike</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      label { display: block; font-weight: 600; margin-top: 1rem; }
      input, select, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
      textarea { min-height: 6rem; }
      button { padding: .6rem 1.2rem; font: inherit; cursor: pointer; margin-top: 1rem; }
      button.rec { background: #c62828; color: #fff; border: 0; border-radius: 6px; }
      .take { border: 1px solid #ccc; border-radius: 6px; padding: .75rem; margin-top: 1rem; }
      .take small { color: #666; }
      .take p { font-size: 1.15rem; margin: .4rem 0 0; }
      .err { color: #c62828; }
    </style>
  </head>
  <body>
    <h1>Correctool – transcription spike</h1>
    <p>Goal: check whether OpenAI keeps your mistakes when transcribing. Say a deliberately wrong sentence (e.g. “il citta è bello”) and see what comes back.</p>

    <label for="key">OpenAI API key (stored only in this browser)</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off" />

    <label for="model">Model</label>
    <select id="model">
      <option>gpt-4o-transcribe</option>
      <option>gpt-4o-mini-transcribe</option>
      <option>whisper-1</option>
    </select>

    <label for="prompt">Verbatim prompt</label>
    <textarea id="prompt"></textarea>

    <button id="rec" class="rec">● Start recording</button>
    <div id="status"></div>
    <div id="takes"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
